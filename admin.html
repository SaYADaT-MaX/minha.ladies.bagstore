<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Minha Ladies Bag</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0866f5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #0866f5;
      --blue-dark: #0754cf;
      --bg: #f3f5fa;
      --surface: #ffffff;
      --text: #252d3a;
      --muted: #8993a4;
      --border: #e9edf4;
      --green: #18a66a;
      --orange: #f0a52b;
      --red: #dc5261;
      --radius: 15px;
      --shadow: 0 5px 24px rgba(33, 50, 82, .045);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    input, select, textarea { max-width: 100%; }
    [hidden], .hidden { display: none !important; }

    /* Login */

    #loginScreen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: linear-gradient(135deg, #edf3ff, #f7f8fc);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 70px rgba(31, 68, 130, .09);
    }

    .login-logo {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 17px;
      border-radius: 16px;
      background: var(--blue);
      color: white;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 28px;
    }

    .login-card h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .login-subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .field-label {
      display: block;
      margin: 14px 0 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .field {
      width: 100%;
      min-height: 43px;
      padding: 11px 12px;
      border: 1px solid #dfe5ef;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(8, 102, 245, .08);
    }

    .primary-button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      transition: background .2s;
    }

    .primary-button:hover { background: var(--blue-dark); }

    .login-card .primary-button {
      width: 100%;
      margin-top: 22px;
    }

    #loginMessage, #panelMessage {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #loginMessage { text-align: center; }

    /* Dashboard shell */

    #dashboard {
      min-height: 100vh;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      align-self: start;
      width: 220px;
      height: 100vh;
      padding: 24px 14px;
      overflow-y: auto;
      background: var(--blue);
      color: white;
    }

    .sidebar-brand {
      padding: 0 10px 28px;
    }

    .sidebar-brand strong {
      display: block;
      font-size: 17px;
      letter-spacing: 1.5px;
    }

    .sidebar-brand small {
      display: block;
      margin-top: 5px;
      color: #dbe8ff;
      font-size: 10px;
      letter-spacing: 1.2px;
    }

    .sidebar-label {
      padding: 10px 12px;
      color: #d4e3ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .side-nav {
      display: grid;
      gap: 6px;
    }

    .side-nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 42px;
      padding: 11px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #e1ebff;
      text-align: left;
      font-size: 12px;
      font-weight: 500;
    }

    .side-nav button:hover,
    .side-nav button.active {
      background: white;
      color: var(--blue);
    }

    .side-icon {
      display: inline-grid;
      place-items: center;
      width: 19px;
      font-size: 16px;
    }

    .sidebar-spacer { flex: 1; min-height: 24px; }

    .sidebar-footer {
      padding: 15px 10px 0;
      border-top: 1px solid rgba(255,255,255,.22);
      color: #e1ebff;
      font-size: 10px;
      line-height: 1.7;
    }

    .main-area {
      min-width: 0;
      padding: 25px 28px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .topbar p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-avatar {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #e4edff;
      color: var(--blue);
      font-weight: 700;
    }

    .logout-button {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
    }

    #panelMessage {
      margin: 0 0 15px;
      padding: 0;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .stat-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 11px;
      background: #eaf1ff;
      color: var(--blue);
      font-size: 18px;
    }

    .stat-value {
      margin-top: 14px;
      font-size: clamp(19px, 2vw, 27px);
      font-weight: 700;
      letter-spacing: -.5px;
      overflow-wrap: anywhere;
    }

    .stat-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .stat-note.green { color: var(--green); }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(230px, .85fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    .panel-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 14px;
    }

    .panel-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .chart-wrap {
      width: 100%;
      min-height: 180px;
    }

    #revenueChart {
      display: block;
      width: 100%;
      height: auto;
      min-height: 150px;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
    }

    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--blue);
    }

    .legend-dot.orange { background: var(--orange); }

    .status-list { display: grid; gap: 17px; }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
    }

    .status-row span { color: var(--muted); }

    .progress-track {
      height: 7px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf1f7;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }

    .progress-fill.orange { background: var(--orange); }
    .progress-fill.green { background: var(--green); }
    .progress-fill.red { background: var(--red); }

    .section-panel {
      margin-top: 20px;
      scroll-margin-top: 18px;
    }

    .section-panel > .panel-card { margin-bottom: 18px; }

    .section-panel h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-description {
      margin: 6px 0 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .section-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .secondary-button {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
    }

    .secondary-button:hover { border-color: var(--blue); color: var(--blue); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 14px;
    }

    .form-grid .full-width { grid-column: 1 / -1; }

    .form-label {
      display: block;
      margin: 12px 0 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .dashboard-field {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid #dfe5ef;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 12px;
    }

    .dashboard-field:focus { border-color: var(--blue); }

    textarea.dashboard-field {
      resize: vertical;
      min-height: 90px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 15px 0;
      font-size: 12px;
    }

    .checkbox-row input { width: auto; }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .form-actions button { flex: 1; }

    .admin-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .item-card {
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      overflow-wrap: anywhere;
    }

    .item-card h3 {
      margin: 0 0 7px;
      font-size: 13px;
    }

    .item-card p {
      margin: 5px 0;
      color: #657084;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .item-actions button {
      flex: 1;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      font-size: 11px;
      font-weight: 700;
    }

    .item-actions .edit-button { color: var(--blue); }
    .item-actions .delete-button { color: var(--red); }

    .order-card {
      margin-bottom: 15px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .order-card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }

    .order-card-head h3 {
      margin: 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .order-card-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .status-pill {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 99px;
      background: #edf3ff;
      color: var(--blue);
      font-size: 10px;
      font-weight: 700;
    }

    .status-pill.paid,
    .status-pill.delivered { background: #e6f8ef; color: #148554; }

    .status-pill.cancelled,
    .status-pill.failed { background: #fff0f1; color: #c23b4b; }

    .status-pill.pending,
    .status-pill.unpaid,
    .status-pill.unverified { background: #fff4df; color: #a46b08; }

    .order-details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      padding: 14px 0;
    }

    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .detail-value {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .order-box {
      padding: 13px;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f8faff;
      overflow-wrap: anywhere;
    }

    .order-box h4 { margin: 0 0 10px; font-size: 12px; }

    .order-items-list { display: grid; gap: 9px; }

    .order-item {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 11px;
    }

    .order-item p { margin: 4px 0; color: #657084; }

    .summary-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 0;
      font-size: 11px;
    }

    .summary-line.total {
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-weight: 700;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 25px 14px;
      border: 1px dashed #dbe2ee;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .help-text {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .mobile-menu-button { display: none; }

    @media (max-width: 1100px) {
      .app-layout { grid-template-columns: 190px minmax(0, 1fr); }
      .sidebar { width: 190px; }
      .main-area { padding: 22px 18px 35px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content-grid { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 700px) {
      .app-layout { display: block; }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 1000;
        width: min(270px, 82vw);
        height: 100dvh;
        transform: translateX(-105%);
        transition: transform .25s ease;
        box-shadow: 12px 0 35px rgba(0,0,0,.15);
      }

      .sidebar.open { transform: translateX(0); }

      .mobile-menu-button {
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: white;
        color: var(--text);
        font-size: 20px;
      }

      .main-area { padding: 17px 13px 30px; }

      .topbar { gap: 9px; margin-bottom: 20px; }
      .topbar h1 { font-size: 20px; }
      .topbar p { font-size: 10px; }
      .topbar-right { gap: 6px; }
      .admin-avatar { width: 32px; height: 32px; }
      .logout-button { padding: 8px 9px; font-size: 10px; }

      .stats-grid { gap: 10px; }
      .stat-card { padding: 13px; }
      .stat-top { font-size: 10px; }
      .stat-icon { width: 30px; height: 30px; font-size: 15px; }
      .stat-value { margin-top: 10px; font-size: 21px; }
      .stat-note { font-size: 9px; }

      .panel-card { padding: 15px; }
      .admin-list { grid-template-columns: minmax(0, 1fr); }
      .form-grid { grid-template-columns: minmax(0, 1fr); }
      .form-grid .full-width { grid-column: auto; }
      .order-details-grid { grid-template-columns: minmax(0, 1fr); }
      .order-card { padding: 13px; }
    }

    @media (max-width: 360px) {
      .main-area { padding-right: 9px; padding-left: 9px; }
      .stats-grid { grid-template-columns: minmax(0, 1fr); }
      .topbar h1 { font-size: 18px; }
    }
  </style>
</head>

<body>
  <main id="loginScreen">
    <section class="login-card">
      <div class="login-logo">M</div>
      <h1>Minha Ladies Bag</h1>
      <p class="login-subtitle">Secure Administrator Login</p>

      <form id="loginForm">
        <label class="field-label" for="email">Admin Email</label>
        <input class="field" id="email" type="email"
          autocomplete="username" placeholder="Enter admin email" required>

        <label class="field-label" for="password">Password</label>
        <input class="field" id="password" type="password"
          autocomplete="current-password" placeholder="Enter password" required>

        <button class="primary-button" id="loginButton" type="submit">
          Login to Admin
        </button>
      </form>

      <p id="loginMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <section id="dashboard" class="hidden" aria-label="Admin Dashboard"></section>

  <script type="module" src="./admin.js"></script>
</body>
</html>
