<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Minha Ladies Bag</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .orders-page {
      max-width: 950px;
      margin: 35px auto;
      padding: 0 16px 40px;
    }

    .orders-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .orders-heading h1 {
      margin-bottom: 8px;
    }

    .orders-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .orders-message {
      padding: 14px;
      border-radius: 10px;
      background: #f0e6da;
      margin: 15px 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .order-card {
      background: #fff;
      border: 1px solid #eadfd3;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 5px 18px rgba(48, 40, 33, .06);
      overflow-wrap: anywhere;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid #eee4da;
    }

    .order-top h2 {
      font-size: 19px;
      margin: 0 0 6px;
    }

    .order-date {
      font-size: 13px;
      color: #766b61;
    }

    .status-pill {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      background: #f0e6da;
      color: #814438;
      text-transform: capitalize;
    }

    .order-section {
      margin-top: 18px;
    }

    .order-section h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .order-items {
      padding-left: 20px;
      margin: 8px 0;
    }

    .order-items li {
      margin-bottom: 8px;
    }

    .order-info {
      line-height: 1.8;
      font-size: 14px;
    }

    .total-box {
      background: #faf7f2;
      border-radius: 10px;
      padding: 14px;
      margin-top: 15px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 7px 0;
    }

    .grand-total {
      border-top: 1px solid #ded0c2;
      padding-top: 10px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .delivery-box,
    .payment-box {
      background: #faf7f2;
      border: 1px solid #eadfd3;
      border-radius: 11px;
      padding: 15px;
      margin-top: 15px;
    }

    .payment-box h3,
    .delivery-box h3 {
      margin-top: 0;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    .order-field {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #d8c8b8;
      border-radius: 8px;
      background: #fff;
      color: #302821;
      font: inherit;
    }

    .payment-help {
      font-size: 13px;
      line-height: 1.7;
      color: #65594f;
      overflow-wrap: anywhere;
    }

    .payment-deadline {
      font-weight: 700;
      color: #814438;
    }

    .primary-action {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      margin-top: 14px;
      background: #a65f50;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-action:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary-action {
      border: 1px solid #a65f50;
      border-radius: 8px;
      padding: 10px 16px;
      background: #fff;
      color: #814438;
      font: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .order-card {
        padding: 15px;
      }

      .orders-page {
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Minha Ladies Bag</a>

      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >☰</button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQs</a>
        <a href="my-orders.html" aria-current="page">My Orders</a>
        <a href="cart.html">Cart</a>
      </nav>
    </div>
  </header>

  <main class="orders-page">
    <div class="orders-heading">
      <h1>My Orders</h1>
      <p>Track your orders, delivery details and payment status.</p>
    </div>

    <div class="orders-actions">
      <button type="button" id="refreshOrders" class="secondary-action">
        Refresh Orders
      </button>
    </div>

    <div id="ordersMessage" class="orders-message" role="status">
      Loading your orders...
    </div>

    <div id="ordersList"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="currentYear"></span> Minha Ladies Bag. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      collection,
      getDocs,
      query,
      where,
      doc,
      getDoc,
      updateDoc,
      deleteField
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const ordersList = document.getElementById("ordersList");
    const ordersMessage = document.getElementById("ordersMessage");
    const refreshButton = document.getElementById("refreshOrders");

    let currentUid = null;
    let authReady = false;
    let loading = false;
    let paymentSettings = {};
    let refreshRequested = false;

    const money = value =>
      "৳" + Number(value || 0).toLocaleString("en-BD", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    function safeText(value) {
      return String(value ?? "");
    }

    function escapeHTML(value) {
      return safeText(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatDate(timestamp) {
      if (!timestamp) return "Date unavailable";

      const date = typeof timestamp.toDate === "function"
        ? timestamp.toDate()
        : new Date(timestamp);

      if (Number.isNaN(date.getTime())) return "Date unavailable";

      return date.toLocaleString("en-BD", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function deadlineDate(order) {
      if (!order.paymentDeadline) return null;

      const value = typeof order.paymentDeadline.toDate === "function"
        ? order.paymentDeadline.toDate()
        : new Date(order.paymentDeadline);

      return Number.isNaN(value.getTime()) ? null : value;
    }

    function showMessage(message) {
      ordersMessage.textContent = message;
      ordersMessage.classList.remove("hidden");
    }

    async function loadPaymentSettings() {
      try {
        const snap = await getDoc(doc(db, "settings", "payment"));
        paymentSettings = snap.exists() ? snap.data() : {};
      } catch (error) {
        console.warn("Payment settings could not be loaded:", error);
        paymentSettings = {};
      }
    }

    function paymentMethodLabel(method) {
      const labels = {
        pending: "Not selected yet",
        cod: "Cash on Delivery",
        bkash: "bKash",
        nagad: "Nagad",
        rocket: "Rocket"
      };

      return labels[method] || safeText(method || "Not selected");
    }

    function paymentStatusLabel(status) {
      const labels = {
        unpaid: "Unpaid",
        unverified: "Waiting for admin verification",
        paid: "Paid",
        failed: "Payment failed",
        refunded: "Refunded"
      };

      return labels[status] || safeText(status || "Unpaid");
    }

    function createPaymentForm(order, card) {
      const method = order.paymentMethod || "pending";
      const status = order.paymentStatus || "unpaid";
      const deadline = deadlineDate(order);

      if (
        order.status !== "confirmed" ||
        ["cancelled", "delivered"].includes(order.status) ||
        status === "paid"
      ) {
        return;
      }

      const box = document.createElement("section");
      box.className = "payment-box";

      const heading = document.createElement("h3");
      heading.textContent = "Payment";
      box.appendChild(heading);

      if (status === "unverified") {
        const info = document.createElement("p");
        info.className = "payment-help";
        info.textContent =
          "Your transaction details have been submitted. Please wait for admin verification.";
        box.appendChild(info);
        card.appendChild(box);
        return;
      }

      if (method !== "pending" && method !== "cod") {
        const info = document.createElement("p");
        info.className = "payment-help";
        info.textContent =
          "Online payment method already selected. If you have not submitted payment details, contact the store before paying again.";
        box.appendChild(info);
        card.appendChild(box);
        return;
      }

      if (method === "cod") {
        const info = document.createElement("p");
        info.className = "payment-help";
        info.textContent =
          "Cash on Delivery selected. Pay the order amount according to the store's delivery instructions.";
        box.appendChild(info);
      }

      const form = document.createElement("form");
      form.innerHTML = `
        <label class="field-label" for="method-${escapeHTML(order.id)}">
          Choose payment method
        </label>
        <select class="order-field" id="method-${escapeHTML(order.id)}" name="method" required>
          <option value="cod" ${method === "cod" ? "selected" : ""}>Cash on Delivery</option>
          <option value="bkash">bKash</option>
          <option value="nagad">Nagad</option>
          <option value="rocket">Rocket</option>
        </select>

        <div class="online-fields hidden">
          <p class="payment-help account-instructions"></p>
          <label class="field-label">Sender mobile number</label>
          <input class="order-field" name="senderPhone" type="tel"
            maxlength="20" autocomplete="tel" placeholder="Number used to send payment">

          <label class="field-label">Transaction ID (TrxID)</label>
          <input class="order-field" name="transactionId" type="text"
            maxlength="100" placeholder="Enter transaction ID">
          <p class="payment-help deadline-text"></p>
        </div>

        <button class="primary-action" type="submit">Save Payment Choice</button>
      `;

      const methodSelect = form.elements.method;
      const onlineFields = form.querySelector(".online-fields");
      const accountInstructions = form.querySelector(".account-instructions");
      const deadlineText = form.querySelector(".deadline-text");
      const senderInput = form.elements.senderPhone;
      const transactionInput = form.elements.transactionId;

      function updatePaymentFields() {
        const selected = methodSelect.value;
        const isOnline = selected !== "cod";

        onlineFields.classList.toggle("hidden", !isOnline);
        senderInput.required = isOnline;
        transactionInput.required = isOnline;

        const accountKey = {
          bkash: "bkashNumber",
          nagad: "nagadNumber",
          rocket: "rocketNumber"
        }[selected];

        const accountNumber = paymentSettings[accountKey];

        accountInstructions.textContent = accountNumber
          ? `Send the order amount to the store's ${paymentMethodLabel(selected)} number: ${accountNumber}. Then enter your sender number and TrxID.`
          : `The store's ${paymentMethodLabel(selected)} number is not available here yet. Contact the store before sending money.`;

        if (deadline) {
          deadlineText.textContent =
            `Payment deadline: ${deadline.toLocaleString("en-BD")}`;
        } else {
          deadlineText.textContent =
            "Payment deadline has not been set yet. Contact the store before making an online payment.";
        }

        const button = form.querySelector("button[type='submit']");
        button.disabled = isOnline && (!accountNumber || !deadline || deadline.getTime() < Date.now());
      }

      methodSelect.addEventListener("change", updatePaymentFields);
      updatePaymentFields();

      form.addEventListener("submit", async event => {
        event.preventDefault();

        if (!currentUid) {
          alert("Please wait for your account to load.");
          return;
        }

        const selected = methodSelect.value;
        const isOnline = selected !== "cod";
        const senderPhone = senderInput.value.trim();
        const transactionId = transactionInput.value.trim();

        if (isOnline) {
          const accountKey = {
            bkash: "bkashNumber",
            nagad: "nagadNumber",
            rocket: "rocketNumber"
          }[selected];

          if (!paymentSettings[accountKey]) {
            alert("The store's payment number is not configured. Contact the store.");
            return;
          }

          if (!deadline || deadline.getTime() < Date.now()) {
            alert("The payment deadline has expired or has not been set. Contact the store.");
            return;
          }

          if (!senderPhone || !transactionId) {
            alert("Enter both sender number and transaction ID.");
            return;
          }
        }

        const submitButton = form.querySelector("button[type='submit']");
        submitButton.disabled = true;
        submitButton.textContent = "Saving...";

        try {
          const orderRef = doc(db, "orders", order.id);
          const latest = await getDoc(orderRef);

          if (!latest.exists()) {
            throw new Error("This order could not be found.");
          }

          const latestOrder = latest.data();

          if (latestOrder.ownerUid !== currentUid) {
            throw new Error("You cannot update another customer's order.");
          }

          if (latestOrder.status !== "confirmed") {
            throw new Error("The admin must confirm this order first.");
          }

          if (latestOrder.paymentStatus === "paid" ||
              latestOrder.paymentStatus === "unverified") {
            throw new Error("Payment has already been submitted or verified.");
          }

          const updateData = isOnline
            ? {
                paymentMethod: selected,
                paymentStatus: "unverified",
                senderPhone,
                transactionId
              }
            : {
                paymentMethod: "cod",
                paymentStatus: "unpaid",
                senderPhone: deleteField(),
                transactionId: deleteField()
              };

          await updateDoc(orderRef, updateData);

          alert(isOnline
            ? "Payment details submitted. Wait for admin verification."
            : "Cash on Delivery selected.");

          await loadOrders();
        } catch (error) {
          console.error("Payment update failed:", error);
          alert(error.message || "Could not save payment choice. Please try again.");
          submitButton.disabled = false;
          submitButton.textContent = "Save Payment Choice";
        }
      });

      box.appendChild(form);
      card.appendChild(box);
    }

    function renderOrder(order) {
      const card = document.createElement("article");
      card.className = "order-card";

      const items = Array.isArray(order.items) ? order.items : [];
      const subtotal = Number(order.total || 0);
      const deliveryFee = Number(order.deliveryFee || 0);
      const grandTotal = order.grandTotal != null
        ? Number(order.grandTotal)
        : subtotal + deliveryFee;

      const itemHTML = items.length
        ? items.map(item => {
            const name = escapeHTML(item.name || "Product");
            const quantity = Number(item.quantity || item.qty || 1);
            const price = Number(item.price || 0);
            const lineTotal = item.subtotal != null
              ? Number(item.subtotal)
              : price * quantity;

            return `<li>
              <strong>${name}</strong><br>
              ${money(price)} × ${quantity} = ${money(lineTotal)}
            </li>`;
          }).join("")
        : "<li>Order item details are unavailable.</li>";

      const statusText = escapeHTML(order.status || "pending");
      const paymentMethod = escapeHTML(paymentMethodLabel(order.paymentMethod));
      const paymentStatus = escapeHTML(paymentStatusLabel(order.paymentStatus));
      const deadline = deadlineDate(order);

      card.innerHTML = `
        <div class="order-top">
          <div>
            <h2>Order #${escapeHTML(order.id)}</h2>
            <div class="order-date">Placed: ${escapeHTML(formatDate(order.createdAt))}</div>
          </div>
          <span class="status-pill">${statusText}</span>
        </div>

        <section class="order-section">
          <h3>Items Ordered</h3>
          <ul class="order-items">${itemHTML}</ul>

          <div class="total-box">
            <div class="total-row">
              <span>Subtotal</span>
              <strong>${money(subtotal)}</strong>
            </div>
            <div class="total-row">
              <span>Delivery Fee</span>
              <strong>${money(deliveryFee)}</strong>
            </div>
            <div class="total-row grand-total">
              <span>Grand Total</span>
              <strong>${money(grandTotal)}</strong>
            </div>
          </div>
        </section>

        <section class="order-section">
          <h3>Customer & Delivery Details</h3>
          <div class="order-info">
            <strong>Name:</strong> ${escapeHTML(order.customerName || "—")}<br>
            <strong>Phone:</strong> ${escapeHTML(order.phone || "—")}<br>
            <strong>Address:</strong> ${escapeHTML(order.address || "—")}
          </div>
        </section>

        <section class="delivery-box">
          <h3>Delivery Tracking</h3>
          <div class="order-info">
            <strong>Status:</strong> ${statusText}<br>
            <strong>Courier:</strong> ${escapeHTML(order.courierName || "Not assigned yet")}<br>
            <strong>Tracking Number:</strong> ${escapeHTML(order.trackingNumber || "Not available yet")}
          </div>
        </section>

        <section class="order-section">
          <h3>Payment Status</h3>
          <div class="order-info">
            <strong>Method:</strong> ${paymentMethod}<br>
            <strong>Status:</strong> ${paymentStatus}
          </div>
          ${
            deadline && order.status === "confirmed" &&
            order.paymentStatus !== "paid"
              ? `<p class="payment-help payment-deadline">Payment deadline: ${escapeHTML(deadline.toLocaleString("en-BD"))}</p>`
              : ""
          }
        </section>
      `;

      createPaymentForm(order, card);
      return card;
    }

    async function loadOrders() {
      if (!authReady || !currentUid || loading) {
        refreshRequested = true;
        return;
      }

      loading = true;
      refreshRequested = false;
      refreshButton.disabled = true;
      ordersList.replaceChildren();
      showMessage("Loading your orders...");

      try {
        await loadPaymentSettings();

        const ordersQuery = query(
          collection(db, "orders"),
          where("ownerUid", "==", currentUid)
        );

        const snapshot = await getDocs(ordersQuery);

        const orders = snapshot.docs.map(orderDoc => ({
          id: orderDoc.id,
          ...orderDoc.data()
        }));

        orders.sort((a, b) => {
          const aTime = a.createdAt?.toMillis?.() || 0;
          const bTime = b.createdAt?.toMillis?.() || 0;
          return bTime - aTime;
        });

        if (!orders.length) {
          showMessage(
            "No orders were found for this browser account. If you ordered before, use the same browser and account you used when placing that order."
          );
          return;
        }

        ordersMessage.classList.add("hidden");

        for (const order of orders) {
          ordersList.appendChild(renderOrder(order));
        }
      } catch (error) {
        console.error("Could not load orders:", error);
        showMessage(
          "Could not load orders. Check your internet connection and Firebase Firestore Rules, then try Refresh Orders."
        );
      } finally {
        loading = false;
        refreshButton.disabled = false;

        if (refreshRequested) {
          refreshRequested = false;
          loadOrders();
        }
      }
    }

    refreshButton.addEventListener("click", loadOrders);

    onAuthStateChanged(auth, async user => {
      try {
        if (!user) {
          authReady = false;
          showMessage("Connecting to your customer account...");
          await signInAnonymously(auth);
          return;
        }

        currentUid = user.uid;
        authReady = true;
        await loadOrders();
      } catch (error) {
        console.error("Authentication failed:", error);
        showMessage(
          "Could not connect to your customer account. Refresh the page and try again."
        );
      }
    });
  </script>
</body>
</html>
